# Never copy this file from other mods, always use https://github.com/ALIENQuake/ProjectInfinity/wiki/Adding-metadata-for-mod
# Filename must be the same as tp2 basename, placed in the same folder where
# .tp2 file is located, use UTF8 (without BOM) encoding, everything is optional

# ini section header is required to avoid false detection
[Metadata]

# Full name of the mod, without the list of supported games, without the version number, without 'Mod'
Name = Weapons Reforged

# Author name or nick, don't use an email address
Author = Celestial Fury

# Short description of the mod, main goals, features etc
Description = A modular overhaul of weapon usability and proficiency rules for EE/EET. Provides universal weapon access, universal and class-restricted proficiency minimums, and fighting-style cap removal.

# Web address of mod readme file (filename is case-sensitive!), comma-separated list. You can link to txt, md, html, pdf etc.
Readme = readme_weapons_reforged.md

# Web address of mod dedicated forum or forum thread
# Forum =

# Web address of mod personal Homepage, no need to duplicate with a mod dedicated forum
Homepage = https://github.com/CelestialFury-BG/weapons-reforged

# If you use GitHub.com, simply use https://github.com/AccountOrOrgName/RepositoryName (omit /releases)
# read more about Delta Updates https://github.com/ALIENQuake/ProjectInfinity/wiki/Delta-Updates-for-mods-hosted-at-GitHub
Download = https://github.com/CelestialFury-BG/weapons-reforged

# Type of LABELs used by the mod, read more here https://www.gibberlings3.net/forums/topic/32516-tutorial-what-is-label
LabelType = GloballyUnique

# Dynamic Install Order, use mod ID as tp2 name without file extension and `setup-` prefix
#
# Install position is a philosophy choice. Weapons Reforged patches three tables
# with different sensitivity to install position:
#
#   - Item usability cleanup (.itm files) — patches only items present at install time
#   - Class weapon access (clasweap.2da) — patches only class rows present at install time
#   - Proficiency minimums (weapprof.2da) — cell-by-cell, later mod wins
#
# The recommended default is LATE INSTALL (Approach A). This ensures the item
# usability cleanup and clasweap.2da patch catch every weapon and kit added by
# other mods, and Weapons Reforged's pip minimums become the authoritative
# weapprof.2da state.
#
# To use EARLY INSTALL instead (Approach B) — for users who want another
# proficiency mod (cdtweaks #2160/#2200/#2280, SCS IWD-proficiencies, Combat
# Skills & Proficiencies, Might & Guile, Skills and Proficiencies) to win on
# weapprof.2da — swap the Before/After lines below to:
#
#   Before = eet_end, cdtweaks, stratagems
#   After =

# Recommended (late install) — install after SCS and cdtweaks, before EET_End:
Before = eet_end
After = stratagems, cdtweaks

# Component definitions
# Format: <index> = <name> | <category>
# Indexes MUST match the DESIGNATED numbers in your weapons_reforged.tp2 exactly!
#
# Component grouping rationale:
#   Components 0-1  — Core Rules. Mutually compatible; can be installed together.
#   Components 2-6  — Universal Proficiency minimums. Choose exactly one.
#   Components 7-10 — Class-Restricted Proficiency minimums. Choose exactly one.
#   Component 11    — Fighting Style caps. Independent; install alongside any choice above.

0 = Remove All Class-based Restrictions on Weapons (Item Usability) | Core Rules
1 = All Classes Can Use All Weapons (Monks Excluded) | Core Rules
2 = Minimum 1 Pip (Proficient) | Universal Proficiency
3 = Minimum 2 Pips (Specialized) | Universal Proficiency
4 = Minimum 3 Pips (Mastery) | Universal Proficiency
5 = Minimum 4 Pips (High Mastery) | Universal Proficiency
6 = Minimum 5 Pips (Grand Mastery) | Universal Proficiency
7 = Minimum 2 Pips (Specialized) | Class-Restricted Proficiency
8 = Minimum 3 Pips (Mastery) | Class-Restricted Proficiency
9 = Minimum 4 Pips (High Mastery) | Class-Restricted Proficiency
10 = Minimum 5 Pips (Grand Mastery) | Class-Restricted Proficiency
11 = Fighting Style Proficiency Caps Removed | Tweaks
